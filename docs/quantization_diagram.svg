<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="mat" x1="160" y1="120" x2="580" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1f2937"/>
      <stop offset="1" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="superblock" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="iq" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#e5e7eb"/>
    </marker>
    <style>
      .title { font: 700 28px/1.2 Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 15px/1.4 Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .label { font: 600 18px/1.2 Inter, Segoe UI, Arial, sans-serif; fill: #e2e8f0; }
      .small { font: 500 13px/1.4 Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 500 12px/1.2 Inter, Segoe UI, Arial, sans-serif; fill: #d1d5db; }
      .mono { font: 600 12px/1.4 Consolas, Menlo, monospace; fill: #dbeafe; }
      .chip { font: 700 13px/1.2 Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>

  <text x="70" y="62" class="title">Model Weight to Compressed Format</text>
  <text x="70" y="90" class="subtitle">Conceptual view of block quantization, super-block packing, and importance-aware formats in GGUF / llama.cpp</text>

  <!-- Left: full weight matrix -->
  <g filter="url(#shadow)">
    <rect x="70" y="140" width="380" height="420" rx="22" fill="url(#mat)" stroke="#64748b" stroke-width="2"/>
    <text x="92" y="176" class="label">Model Weight Matrix</text>
    <text x="92" y="200" class="small">Floating-point weights, e.g. W ∈ R[out_dim × in_dim]</text>

    <!-- matrix grid -->
    <g transform="translate(102,230)">
      <!-- grid background -->
      <rect x="0" y="0" width="306" height="262" rx="16" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
      <!-- cells -->
      <g opacity="0.95">
        <!-- 9x7 grid-ish -->
        <!-- row 1 -->
        <rect x="14" y="14" width="26" height="26" fill="#93c5fd"/>
        <rect x="42" y="14" width="26" height="26" fill="#60a5fa"/>
        <rect x="70" y="14" width="26" height="26" fill="#3b82f6"/>
        <rect x="98" y="14" width="26" height="26" fill="#2563eb"/>
        <rect x="126" y="14" width="26" height="26" fill="#1d4ed8"/>
        <rect x="154" y="14" width="26" height="26" fill="#60a5fa"/>
        <rect x="182" y="14" width="26" height="26" fill="#93c5fd"/>
        <rect x="210" y="14" width="26" height="26" fill="#38bdf8"/>
        <rect x="238" y="14" width="26" height="26" fill="#0ea5e9"/>
        <rect x="266" y="14" width="26" height="26" fill="#0284c7"/>

        <!-- row 2 -->
        <rect x="14" y="42" width="26" height="26" fill="#bfdbfe"/>
        <rect x="42" y="42" width="26" height="26" fill="#93c5fd"/>
        <rect x="70" y="42" width="26" height="26" fill="#60a5fa"/>
        <rect x="98" y="42" width="26" height="26" fill="#3b82f6"/>
        <rect x="126" y="42" width="26" height="26" fill="#2563eb"/>
        <rect x="154" y="42" width="26" height="26" fill="#60a5fa"/>
        <rect x="182" y="42" width="26" height="26" fill="#93c5fd"/>
        <rect x="210" y="42" width="26" height="26" fill="#38bdf8"/>
        <rect x="238" y="42" width="26" height="26" fill="#0ea5e9"/>
        <rect x="266" y="42" width="26" height="26" fill="#0284c7"/>

        <!-- row 3 -->
        <rect x="14" y="70" width="26" height="26" fill="#dbeafe"/>
        <rect x="42" y="70" width="26" height="26" fill="#bfdbfe"/>
        <rect x="70" y="70" width="26" height="26" fill="#93c5fd"/>
        <rect x="98" y="70" width="26" height="26" fill="#60a5fa"/>
        <rect x="126" y="70" width="26" height="26" fill="#3b82f6"/>
        <rect x="154" y="70" width="26" height="26" fill="#60a5fa"/>
        <rect x="182" y="70" width="26" height="26" fill="#93c5fd"/>
        <rect x="210" y="70" width="26" height="26" fill="#38bdf8"/>
        <rect x="238" y="70" width="26" height="26" fill="#0ea5e9"/>
        <rect x="266" y="70" width="26" height="26" fill="#0284c7"/>

        <!-- row 4 -->
        <rect x="14" y="98" width="26" height="26" fill="#1e293b"/>
        <rect x="42" y="98" width="26" height="26" fill="#334155"/>
        <rect x="70" y="98" width="26" height="26" fill="#475569"/>
        <rect x="98" y="98" width="26" height="26" fill="#64748b"/>
        <rect x="126" y="98" width="26" height="26" fill="#94a3b8"/>
        <rect x="154" y="98" width="26" height="26" fill="#64748b"/>
        <rect x="182" y="98" width="26" height="26" fill="#475569"/>
        <rect x="210" y="98" width="26" height="26" fill="#334155"/>
        <rect x="238" y="98" width="26" height="26" fill="#1e293b"/>
        <rect x="266" y="98" width="26" height="26" fill="#0f172a"/>

        <!-- row 5 -->
        <rect x="14" y="126" width="26" height="26" fill="#1e293b"/>
        <rect x="42" y="126" width="26" height="26" fill="#334155"/>
        <rect x="70" y="126" width="26" height="26" fill="#475569"/>
        <rect x="98" y="126" width="26" height="26" fill="#64748b"/>
        <rect x="126" y="126" width="26" height="26" fill="#94a3b8"/>
        <rect x="154" y="126" width="26" height="26" fill="#64748b"/>
        <rect x="182" y="126" width="26" height="26" fill="#475569"/>
        <rect x="210" y="126" width="26" height="26" fill="#334155"/>
        <rect x="238" y="126" width="26" height="26" fill="#1e293b"/>
        <rect x="266" y="126" width="26" height="26" fill="#0f172a"/>
      </g>
    </g>
  </g>

  <!-- Arrow 1 -->
  <line x1="460" y1="350" x2="605" y2="350" stroke="#e5e7eb" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="485" y="322" class="chip">split / group</text>

  <!-- Middle: blocks and superblock -->
  <g filter="url(#shadow)">
    <rect x="620" y="130" width="340" height="440" rx="22" fill="#0b1220" stroke="#475569" stroke-width="2"/>
    <text x="642" y="168" class="label">Block Quantization</text>
    <text x="642" y="192" class="small">Each block gets local scale / zero-point / codebook metadata</text>

    <!-- blocks -->
    <g transform="translate(658,230)">
      <rect x="0" y="0" width="90" height="82" rx="16" fill="url(#block)"/>
      <rect x="104" y="0" width="90" height="82" rx="16" fill="url(#block)"/>
      <rect x="208" y="0" width="90" height="82" rx="16" fill="url(#block)"/>
      <rect x="0" y="102" width="90" height="82" rx="16" fill="url(#block)"/>
      <rect x="104" y="102" width="90" height="82" rx="16" fill="url(#block)"/>
      <rect x="208" y="102" width="90" height="82" rx="16" fill="url(#block)"/>

      <text x="45" y="36" text-anchor="middle" class="mono">block 0</text>
      <text x="149" y="36" text-anchor="middle" class="mono">block 1</text>
      <text x="253" y="36" text-anchor="middle" class="mono">block 2</text>
      <text x="45" y="138" text-anchor="middle" class="mono">block 3</text>
      <text x="149" y="138" text-anchor="middle" class="mono">block 4</text>
      <text x="253" y="138" text-anchor="middle" class="mono">block 5</text>

      <text x="45" y="58" text-anchor="middle" class="tiny">weights</text>
      <text x="149" y="58" text-anchor="middle" class="tiny">weights</text>
      <text x="253" y="58" text-anchor="middle" class="tiny">weights</text>
      <text x="45" y="160" text-anchor="middle" class="tiny">weights</text>
      <text x="149" y="160" text-anchor="middle" class="tiny">weights</text>
      <text x="253" y="160" text-anchor="middle" class="tiny">weights</text>
    </g>

    <text x="642" y="494" class="small">Example: simple Q4 formats use small blocks with per-block metadata.</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="960" y1="350" x2="1090" y2="350" stroke="#e5e7eb" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="985" y="322" class="chip">pack more efficiently</text>

  <!-- Right: compressed formats -->
  <g filter="url(#shadow)">
    <rect x="1100" y="110" width="240" height="500" rx="22" fill="#111827" stroke="#475569" stroke-width="2"/>
    <text x="1120" y="148" class="label">Compressed Formats</text>
    <text x="1120" y="172" class="small">Metadata + quantized codes</text>

    <rect x="1120" y="210" width="200" height="92" rx="18" fill="url(#superblock)"/>
    <text x="1220" y="246" text-anchor="middle" class="label" fill="#fff7ed">Q4_K</text>
    <text x="1220" y="270" text-anchor="middle" class="small" fill="#fff7ed">super-block</text>
    <text x="1220" y="290" text-anchor="middle" class="tiny" fill="#fff7ed">shared scales for many blocks</text>

    <rect x="1120" y="328" width="200" height="92" rx="18" fill="url(#iq)"/>
    <text x="1220" y="364" text-anchor="middle" class="label" fill="#faf5ff">IQ4</text>
    <text x="1220" y="388" text-anchor="middle" class="small" fill="#faf5ff">importance-aware</text>
    <text x="1220" y="408" text-anchor="middle" class="tiny" fill="#faf5ff">precision spent where weights matter</text>

    <rect x="1120" y="446" width="200" height="92" rx="18" fill="#1f2937"/>
    <text x="1220" y="482" text-anchor="middle" class="label">Q4_0 / Q4_1</text>
    <text x="1220" y="506" text-anchor="middle" class="small">simple block formats</text>
    <text x="1220" y="526" text-anchor="middle" class="tiny">older, cheaper, weaker quality</text>
  </g>

  <!-- bottom legend -->
  <g>
    <rect x="70" y="620" width="1270" height="92" rx="18" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <text x="92" y="655" class="label">Reading the diagram</text>
    <text x="92" y="682" class="small">Model weights are split into blocks. Several blocks can be packed into a super-block. Better formats store more local structure or importance information, which usually improves quality at the same nominal bit-width.</text>
  </g>
</svg>
